<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Scheduler</title>

    <link rel="stylesheet" href="../css/">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- ヘッダー -->
    <header>

        <!--サイドバーを開くボタン-->
        <button id="sidebarBtn" class="sidebar-btn">
            ☰
        </button>
        <h1>Campus Scheduler</h1>

        <div class="user-info">
            <span>ユーザー名</span>
        </div>

    </header>

    <!-- 全体 -->
    <div class="container">

        <!-- サイドバー -->
        <aside id="sidebar">
            <nav>
                <ul>
                    <li>カレンダー</a></li>
                    <li>今日の予定</a></li>
                    <li>課題</a></li>
                </ul>
            </nav>
        </aside>

        <!-- メイン -->
        <main>

            <!-- カレンダー -->
            <section id="calendar-area">

                <h2>カレンダー</h2>

                <div class="calendar-mode">
                    <samp>表示する予定：</samp>

                    <label>
                        <input type="checkbox" id="workCheck" checked>
                        仕事
                    </label>

                    <label>
                        <input type="checkbox" id="privateCheck" checked>
                        プライベート
                    </label>
                    <!-- <button id="workBtn" class="mode-active">仕事</button>
                    <button id="privateBtn">プライベート</button> -->
                </div>

                <div class="calendar-header">
                    <button id="prevBtn">◀</button>
                    <span id="monthYear"></span>
                    <button id="nextBtn">▶</button>
                    <button id="todayBtn">今日</button>
                </div>
                
                <div id="calendar"></div>

            </section>

            <!-- 下段 -->
            <div class="bottom-area">

                <!-- 今日の予定 -->
                <section id="schedule-area">

                    <h2>今日の予定</h2>

                </section>

                <!-- 今日の課題 -->
                <section id="task-area">

                    <h2>課題</h2>

                </section>

            </div>

        </main>

    </div>

    <script src="../js/calendar.js"></script>

</body>

</html>
