<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Scheduler</title>

    <link rel="stylesheet" href="../css/">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>

<body>

    <!-- ヘッダー -->
    <header>

        <!--サイドバーを開くボタン-->
        <button id="sidebarBtn" class="sidebar-btn">
            ☰
        </button>
        <h1>Campus Scheduler</h1>

        <div class="user-info">
            <span>ユーザー名</span>
        </div>

    </header>

    <!-- 全体 -->
    <div class="container" id="mainContainer">

        <aside id="sidebar"></aside>

        <!-- メイン -->
        <main>

            <!-- カレンダー -->
            <section id="calendar-area">

                <h2>カレンダー</h2>

                <div class="calendar-header">

                    <button id="prevBtn">◀</button>

                    <span id="monthYear"></span>

                    <div class="calendar-mode">

                        <span>表示する予定：</span>

                        <label>
                            <input type="checkbox" id="workCheck" checked>
                            仕事
                        </label>

                        <label>
                            <input type="checkbox" id="privateCheck" checked>
                            プライベート
                        </label>

                    </div>

                    <button id="nextBtn">▶</button>

                    <button id="todayBtn">今日</button>

                </div>

                <div id="calendar"></div>

            </section>

            <!-- 下段 -->
            <div class="bottom-area">

                <!-- 今日の予定 -->
                <section id="schedule-area">

                    <h2>今日の予定</h2>

                </section>

                <!-- 今日の課題 -->
                <section id="task-area">

                    <h2>課題</h2>

                </section>

            </div>

        </main>

    </div>

    <script src="../js/calendar.js"></script>

    <div id="popupContainer"></div>

    <!-- dialog方式 -->
    <dialog id="lectureDialog" class="event-dialog">

    <form method="dialog">

        <div class="dialog-heading">

            <h2>講義を追加</h2>

            <button
                type="button"
                id="closeLectureDialogBtn"
                class="icon-button">

                ×

            </button>

        </div>

        <label class="field">

            講義名

            <input
                id="lectureName"
                type="text"
                placeholder="例：キャリア設計">

        </label>

        <label class="field">

            担当教員

            <input
                id="lectureTeacher"
                type="text"
                placeholder="例：山田太郎">

        </label>

        <div class="field-row">

            <label class="field">

                曜日

                <select id="lectureDay">

                    <option>月</option>
                    <option>火</option>
                    <option>水</option>
                    <option>木</option>
                    <option>金</option>

                </select>

            </label>

            <label class="field">

                時限

                <select id="lecturePeriod">

                    <option>1限</option>
                    <option>2限</option>
                    <option>3限</option>
                    <option>4限</option>
                    <option>5限</option>

                </select>

            </label>

        </div>

        <label class="field">

            教室

            <input
                id="lectureRoom"
                type="text"
                placeholder="例：K101">

        </label>

        <div class="dialog-actions">

            <span class="action-spacer"></span>

            <button
                type="button"
                id="cancelLectureBtn"
                class="outline-button">

                キャンセル

            </button>

            <button
                type="button"
                id="saveLectureBtn"
                class="primary-button">

                保存

            </button>

        </div>

    </form>

</dialog>

</body>

</html>
