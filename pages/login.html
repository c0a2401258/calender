<!-- ログイン画面 -->
<!-- 担当：B -->
<!-- ================================= -->

<div class="login-page">

    <div class="login-container">

        <h1>ログイン</h1>

        <div class="input-group">

            <label for="email">
                ログインID
            </label>

            <input
                type="text"
                id="email"
                placeholder="ログインID"
            >

        </div>

        <div class="input-group">

            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                placeholder="パスワード"
            >

        </div>

        <button
            class="login-button"
            onclick="login()"
        >
            ログイン
        </button>

        <p id="login-message"></p>

    </div>

</div>
